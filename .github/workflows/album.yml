name: Refresh photo album
on:
  schedule: [{cron: "17 * * * *"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/album.py
      - run: |
          git config user.name "album-bot"; git config user.email "album-bot@users.noreply.github.com"
          git add album.json
          git diff --cached --quiet || (git commit -m "Refresh album" && git push)
