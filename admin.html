<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Admin · Celebrating Bob</title>
<style>
 body{font-family:system-ui,sans-serif;margin:0;padding:24px;color:#1d1d1f;background:#f4f4f5;max-width:1100px;margin:0 auto}
 h1{font-weight:500;margin:0 0 12px} h2{font-weight:500;margin:34px 0 10px} .sum{font-size:18px;margin:6px 0 14px}
 table{border-collapse:collapse;width:100%;background:#fff} th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #e3e3e6;font-size:15px;vertical-align:top}
 th{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#6b6b70} input,button{font:inherit;padding:8px 12px}
 a{color:#1f2f5c} .del{background:#fff;border:1px solid #c33;color:#c33;cursor:pointer;padding:4px 10px;font-size:13px}
 .del:hover{background:#c33;color:#fff} .tag{font-size:12px;color:#6b6b70}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
 .ph{background:#fff;padding:6px;text-align:center} .ph img{width:100%;height:150px;object-fit:cover;display:block;margin-bottom:6px}
 .tabs button{border:1px solid #ccc;background:#fff;cursor:pointer} .tabs button.on{background:#1d1d1f;color:#fff;border-color:#1d1d1f}
</style></head><body>
<h1>Celebrating Bob · Admin</h1>
<form id="f"><input id="k" type="password" placeholder="Password"> <button>Open</button></form>
<div id="out"></div>
<script>
var ENDPOINT = 'https://script.google.com/macros/s/AKfycbxHZUaKoPdcI2KJq2LzoYutxGa2pz6WHH2sCo5xUdu_PR3FZe9gNd827EGJ3_tN_JkKeQ/exec';
var out = document.getElementById('out'), k = document.getElementById('k');
k.value = localStorage.getItem('cb-admin2') || '';
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function post(d){ d.key = k.value; return fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(d)}).then(function(r){return r.json();}); }
var data;
function load(){
  out.textContent = 'Loading…';
  fetch(ENDPOINT + '?admin=' + encodeURIComponent(k.value) + '&v=' + Date.now()).then(function(r){return r.json();}).then(function(d){
    if (d.error) { out.textContent = d.error; return; }
    localStorage.setItem('cb-admin2', k.value); data = d; render();
  }).catch(function(){ out.textContent = 'Could not load.'; });
}
function render(){
  var d = data, people = d.rows.reduce(function(a,r){return a + (Number(r[3])||0);},0);
  var h = '<p><a href="' + d.sheet + '" target="_blank">Open the sheet</a> · <a href="' + d.folder + '" target="_blank">Open the guest photo folder</a></p>';
  h += '<h2>RSVPs</h2><p class="sum"><b>' + people + '</b> people across <b>' + d.rows.length + '</b> RSVPs</p><table><tr><th>Name</th><th>People</th><th>Email</th><th>Received</th></tr>';
  d.rows.slice().reverse().forEach(function(r){
    h += '<tr><td>' + esc(r[1]) + '</td><td>' + esc(r[3]) + '</td><td>' + esc(r[2]) + '</td><td>' + esc(new Date(r[5] || r[0]).toLocaleString()) + '</td></tr>';
  });
  h += '</table><h2>Memories (' + d.memories.length + ')</h2>';
  if (!d.memories.length) h += '<p class="tag">None yet.</p>';
  else {
    h += '<table><tr><th>Name</th><th>Memory</th><th>Shown</th><th></th></tr>';
    d.memories.slice().reverse().forEach(function(m){
      h += '<tr><td>' + esc(m.name) + '<div class="tag">' + esc(new Date(m.t).toLocaleString()) + '</div></td><td style="white-space:pre-line">' + esc(m.text) +
        '</td><td class="tag">' + (m.vis === 'Public' ? (m.hidden ? 'Hidden' : 'On site') : 'Family only') +
        '</td><td><button class="del" data-mem="' + m.row + '">Delete</button></td></tr>';
    });
    h += '</table>';
  }
  h += '<h2>Guest-uploaded photos (' + d.photos.length + ')</h2><p class="tag">Photos from the Google Photos album are managed in Google Photos; remove them from the album there.</p><div class="grid">';
  d.photos.forEach(function(p){
    h += '<div class="ph"><a href="https://drive.google.com/file/d/' + p.id + '/view" target="_blank"><img loading="lazy" src="https://drive.google.com/thumbnail?id=' + p.id + '&sz=w400"></a><button class="del" data-photo="' + p.id + '">Delete</button></div>';
  });
  out.innerHTML = h + '</div>';
}
out.onclick = function(e){
  var b = e.target.closest('.del'); if (!b) return;
  var req;
  if (b.dataset.mem) {
    var m = data.memories.filter(function(x){return String(x.row) === b.dataset.mem;})[0];
    if (!confirm('Delete the memory from ' + m.name + '? This cannot be undone.')) return;
    req = post({ type: 'admin-del-memory', row: m.row, text: m.text });
  } else {
    if (!confirm('Delete this photo from the site?')) return;
    req = post({ type: 'admin-hide', id: b.dataset.photo });
  }
  b.disabled = true; b.textContent = 'Deleting…';
  req.then(function(r){ if (r.error) { alert(r.error); } load(); }).catch(function(){ alert('Could not delete.'); load(); });
};
document.getElementById('f').onsubmit = function(e){ e.preventDefault(); load(); };
if (k.value) load();
</script>
</body></html>
